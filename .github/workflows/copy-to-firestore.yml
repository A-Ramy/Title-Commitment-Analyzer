name: Copy to Firestore

# v2 (docs/PLAN-v2.md): copies everything from the current database into the Firebase project, keeping every id,
# then compares the counts. Safe to run again: re-running brings over anything added since. Log shows counts only.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count what would be copied"
        type: boolean
        default: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run python scripts/copy_to_firestore.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
