name: Daily title summary

# The email goes out at 8:00 AM Eastern every weekday from the engine, called by Google Cloud Scheduler
# (titleagent/daily.py, scripts/scheduler_setup.sh). GitHub starts scheduled runs late or skips them, so these runs are
# only the backup: they send only if nothing went out yet today, and catch up the Team Hub. Times are UTC (EDT / EST):
on:
  schedule:
    - cron: "37 13 * * 1-5"  # 9:37 / 8:37 AM
    - cron: "37 15 * * 1-5"  # 11:37 / 10:37 AM
  workflow_dispatch:  # Run workflow: sends a test email right away (or, with "check only", sends nothing)
    inputs:
      check_only:
        description: "Check only: send nothing, just show where the data comes from"
        type: boolean
        default: false

concurrency:
  group: daily-email  # tries that start together run one after the other, so only one sends
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: Team Hub catch-up (backs up the engine's morning catch-up; it never stops the email)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: uv run --no-sync python scripts/hub_sync.py
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          HUB_SYNC_SECRET: ${{ secrets.HUB_SYNC_SECRET }}
          HUB_URL: ${{ vars.HUB_URL }}
          APP_URL: ${{ vars.APP_URL }}
      - run: uv run --no-sync python scripts/daily_email.py ${{ inputs.check_only && '--check' || github.event_name == 'workflow_dispatch' && '--now' || '' }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}  # https://title.totalchb.com
