name: Daily title summary

# The email arrives at 8:00 AM Eastern every weekday (scripts/daily_email.py). GitHub starts scheduled runs late,
# sometimes by hours, and can skip them, so there are five tries before 8:00. The first that gets through hands the
# email to Resend to deliver at 8:00 sharp; the rest see it's done. Times are UTC (EDT / EST):
on:
  schedule:
    - cron: "17 6 * * 1-5"   # 2:17 / 1:17 AM
    - cron: "17 8 * * 1-5"   # 4:17 / 3:17 AM
    - cron: "47 9 * * 1-5"   # 5:47 / 4:47 AM
    - cron: "47 10 * * 1-5"  # 6:47 / 5:47 AM
    - cron: "17 12 * * 1-5"  # 8:17 / 7:17 AM: last try; sends right away if nothing went out yet
  workflow_dispatch:  # Run workflow: sends a test email right away

concurrency:
  group: daily-email  # tries that start together run one after the other, so only one sends
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --no-group app  # the Streamlit app's packages aren't needed here
      - run: uv run python scripts/daily_email.py ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}
        env:
          # Switch-over to v2: set the repository variable USE_FIRESTORE to true (Settings → Secrets and variables →
          # Actions → Variables) and APP_URL to https://title.totalchb.com. Then the email reads Firestore and links
          # to the new page; without it, the Streamlit app's database as before.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.USE_FIRESTORE == 'true' && secrets.FIREBASE_PROJECT_ID || '' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ vars.USE_FIRESTORE == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
