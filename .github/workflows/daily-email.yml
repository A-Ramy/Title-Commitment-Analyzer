name: Daily title summary

# Weekdays at 7:52 AM Eastern all year, so it lands around 8:00 (GitHub starts scheduled runs a few minutes late).
# Cron is UTC only: one schedule for daylight time (11:52 UTC) and one for standard time (12:52 UTC); each run
# checks which one New York is on and skips if it's the other.
on:
  schedule:
    - cron: "52 11 * * 1-5"  # 7:52 AM EDT
    - cron: "52 12 * * 1-5"  # 7:52 AM EST
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Eastern-time check
        id: when
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)
          if { [ "$SCHEDULE" = "52 11 * * 1-5" ] && [ "$offset" != "-0400" ]; } ||
             { [ "$SCHEDULE" = "52 12 * * 1-5" ] && [ "$offset" != "-0500" ]; }; then
            echo "Not 7:52 AM in New York on this schedule (offset $offset); the other one sends today."
            echo "send=no" >> "$GITHUB_OUTPUT"
          else
            echo "send=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.when.outputs.send == 'yes'
        uses: actions/checkout@v4
      - if: steps.when.outputs.send == 'yes'
        uses: astral-sh/setup-uv@v6
      - if: steps.when.outputs.send == 'yes'
        run: uv sync --no-dev
      - if: steps.when.outputs.send == 'yes'
        run: uv run python scripts/daily_email.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
