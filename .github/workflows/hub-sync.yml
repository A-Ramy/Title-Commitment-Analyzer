name: Universal Team Hub sync

# Every open deal's Closing Blockers to the Universal Team Hub (hub.totalchb.com), and back any blocker ticked or
# unticked there (scripts/hub_sync.py). The engine sends a deal right after each change; the daily catch-up runs with
# the morning email (daily-email.yml; owner 2026-10-30: no 15-minute runs). This workflow is a catch-up by hand
# (Run workflow). Logs show counts only.
on:
  workflow_dispatch:

concurrency:
  group: hub-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - name: Can the hub be reached? (an unsigned request should get 401)
        run: |
          URL="${HUB_URL:-https://hub.totalchb.com/api/title-agent}"
          echo "hub answers: $(curl -s -o /dev/null -w '%{http_code} after %{time_total}s, %{num_redirects} redirects' -X POST "$URL" || echo 'no connection')"
        env:
          HUB_URL: ${{ vars.HUB_URL }}
      - run: uv run --no-sync python scripts/hub_sync.py
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          HUB_SYNC_SECRET: ${{ secrets.HUB_SYNC_SECRET }}
          HUB_URL: ${{ vars.HUB_URL }}  # optional; default https://hub.totalchb.com/api/title-agent
          APP_URL: ${{ vars.APP_URL }}  # https://title.totalchb.com
