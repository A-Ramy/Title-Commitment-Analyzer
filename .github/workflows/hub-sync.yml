name: Universal Team Hub sync

# Every open deal's Closing Blockers to the Universal Team Hub (tasks.totalchb.com), and back any blocker ticked or
# unticked there (scripts/hub_sync.py). The engine also sends a deal right after each change; this run catches up
# anything missed. Logs show counts only.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes (GitHub may start scheduled runs late)
  workflow_dispatch:

concurrency:
  group: hub-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-sync python scripts/hub_sync.py
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          HUB_SYNC_SECRET: ${{ secrets.HUB_SYNC_SECRET }}
          APP_URL: ${{ vars.APP_URL }}  # https://title.totalchb.com
