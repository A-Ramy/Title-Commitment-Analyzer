[project]
name = "title-agent"
version = "0.1.0"
description = "Title Commitment Analyzer (Title Agent) for Total Cash Home Buyers"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.66.0",  # same version as the Projection Tool, which shares brand.css
    "Authlib>=1.3.2",  # Google sign-in (st.login)
    "anthropic>=1.0",
    "pypdf>=5.0",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "gspread>=6.1",
    "google-auth>=2.30",
    "google-api-python-client>=2.130",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
