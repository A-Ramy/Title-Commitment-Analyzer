[project]
name = "title-agent"
version = "0.1.0"
description = "Title Commitment Agent (Total Cash Home Buyers): the review engine behind title.totalchb.com"
requires-python = ">=3.11"
dependencies = [  # the engine and the daily email (engine/requirements.txt: uv export --no-dev)
    "anthropic>=1.0",
    "pypdf>=5.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "google-auth>=2.30",
    "google-api-python-client>=2.130",
    "requests>=2.32",
    "firebase-admin>=6.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]  # FastAPI's own idiom (engine/main.py)
