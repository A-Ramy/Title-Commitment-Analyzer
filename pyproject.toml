[project]
name = "title-agent"
version = "0.1.0"
description = "Title Commitment Analyzer (Title Agent) for Total Cash Home Buyers"
requires-python = ">=3.11"
dependencies = [  # the engine and the scripts (engine/requirements.txt); the Streamlit app adds the "app" group
    "anthropic>=1.0",
    "pypdf>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "google-auth>=2.30",
    "google-api-python-client>=2.130",
    "requests>=2.32",
    "firebase-admin>=6.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
app = [  # the Streamlit app (requirements.txt for Streamlit Community Cloud)
    "streamlit==1.66.0",  # same version as the Projection Tool, which shares brand.css
    "Authlib>=1.3.2",  # Google sign-in (st.login)
    "pandas>=2.2",
    "gspread>=6.1",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]  # FastAPI's own idiom (engine/main.py)
